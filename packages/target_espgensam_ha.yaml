# TRANSPORT: espgensam via Home Assistant.
#
# This package is the only file that knows Home Assistant exists or names an entity. It is the
# seam for the planned UDP-direct transport: a target_espgensam_udp.yaml implementing the same
# same scripts and writing the same globals drops in here with no change to control.yaml or the
# ui_*.yaml packages.
#
# The contract it implements (see AGENTS.md):
#   provides scripts   target_set_volume(db), target_toggle_mute(), target_set_power(on),
#                      target_set_group(name), target_refresh_scenes(),
#                      target_activate_scene(scene)
#   writes globals     vol_db, vol_min, vol_max, vol_step, bounds_known, is_muted, sys_power_off,
#                      group_names, group_active, group_pending_until_ms,
#                      scene_names, scene_keys, scene_last
#   defines            derive_state
#   invokes            on_volume_reported(reported), on_groups_changed, on_scenes_changed
#
# Group presets and volume ducking (no action needed — documented so it is not "fixed" later):
# when espgensam has groups configured it pushes one at every wake and rediscovery, ducking the
# volume for the duration (start_group_apply_/finish_group_apply_ in components/gensam/race.cpp).
# The duck sends a broadcast frame only: it never touches current_volume_db_ and never publishes
# state, so the dial keeps showing the true target throughout and must NOT try to follow it. A
# dial write made mid-push is accepted and published at once but held back from the bus until
# the push ends, when the closing restore sends it — so turning the knob cannot lift the duck.
#
# Only four espgensam entities are used, and the fourth — the group preset select — is optional.
# The 42 per-monitor entities (mute, online, temperature, levels, model/serial/firmware,
# identify, input routing, crossover, level, delay, calibration bypass) and the other group
# controls (Group Modified, Bypass Calibration) are deliberately out of scope — this is a
# hardware control, not a dashboard. Depending on so few entities is also the best defence
# against espgensam's still-moving schema: it has added, renamed and removed entities
# repeatedly, but Volume (dB), Bus Status and the media player have never changed.
#
# The group select is read twice: its state is the current group, its `options` attribute the
# list. espgensam publishes a requested group at once, before the push has happened, and
# silently ignores a name it does not know, so the dial treats the state as confirmation of the
# request and nothing more. A group changed from GLM itself is not seen by espgensam, so it is
# not seen here either.
#
# Scenes are Home Assistant's, not espgensam's, and are found by label rather than by entity id —
# see target_refresh_scenes for how. A scene key is its entity id; control.yaml treats it as
# opaque.

api:
  # The other half of the scene query; see target_refresh_scenes. Home Assistant registers this as
  # esphome.<node name>_scene_query. It does nothing and answers with an empty object, which is
  # all target_refresh_scenes needs from it. Nothing else should call it.
  actions:
    - action: scene_query
      then:
        - api.respond:
            data: !lambda "(void) root;"

  # Home Assistant registers the action above, and starts accepting this device's action calls,
  # only once the connection is up, so the first query waits a moment. Any client connecting
  # (such as `esphome logs`) also lands here, which costs one extra query.
  on_client_connected:
    - lambda: |-
        id(scene_query_stalled) = false;
        id(scene_query_sent_ms) = 0;
    - script.execute: scene_refresh_soon

number:
  # READ-ONLY bridge to espgensam's "Volume (dB)". Writes go through target_set_volume, which
  # calls the action directly — see the comment there for why.
  #
  # Used only to mirror the current value. Bounds come from the three attribute sensors below
  # rather than from this platform's internal traits: those are not observable from YAML, so a
  # failure to populate them is indistinguishable from bounds that happen to equal our fallbacks.
  - platform: homeassistant
    id: ha_volume
    entity_id: ${ent_volume}
    on_value:
      - script.execute:
          id: on_volume_reported
          reported: !lambda "return x;"

sensor:
  # Volume bounds, read as the number entity's capability attributes. Home Assistant publishes
  # `min`, `max` and `step` on every `number` entity, so this is the dial's whole reason for not
  # hardcoding -80/-30: espgensam's committed config, its -25.0 local variant, and any future
  # change are all picked up automatically.
  #
  # bounds_seen tracks which have actually arrived. A "have we received it" flag cannot be
  # inferred from the values themselves, because real bounds may be identical to the fallbacks —
  # the deployed controller reports exactly -80/-30/0.5. An earlier version set bounds_known from
  # a change comparison and consequently never set it at all on that hardware.
  - platform: homeassistant
    id: ha_vol_min
    entity_id: ${ent_volume}
    attribute: min
    on_value:
      - lambda: |-
          id(vol_min) = x;
          id(bounds_seen) |= 0x01;
      - script.execute: bounds_check

  - platform: homeassistant
    id: ha_vol_max
    entity_id: ${ent_volume}
    attribute: max
    on_value:
      - lambda: |-
          id(vol_max) = x;
          id(bounds_seen) |= 0x02;
      - script.execute: bounds_check

  - platform: homeassistant
    id: ha_vol_step
    entity_id: ${ent_volume}
    attribute: step
    on_value:
      - lambda: |-
          id(vol_step) = x;
          id(bounds_seen) |= 0x04;
      - script.execute: bounds_check

text_sensor:
  # media_player state: on | off | unavailable | unknown. "off" means system standby.
  - platform: homeassistant
    id: ha_media_state
    entity_id: ${ent_media}
    on_value:
      - script.execute: derive_state

  # espgensam's bus health: Active | GLM Active | Discovering | Configuring | Offline.
  - platform: homeassistant
    id: ha_bus_status
    entity_id: ${ent_bus_status}
    on_value:
      - script.execute: derive_state

  # Current group preset. Arrives as "unavailable" when espgensam drops off Home Assistant, and
  # as "unknown" before espgensam has published one (listen-only mode, or `default_group: none`
  # before anything was chosen).
  - platform: homeassistant
    id: ha_group
    entity_id: ${ent_group}
    on_value:
      - lambda: |-
          id(group_active) = (x == "unavailable" || x == "unknown") ? std::string() : x;
          id(group_pending_until_ms) = 0;  // confirmed by the source of truth
      - script.execute: ui_refresh

  # The group list, as the select's `options` attribute. Home Assistant forwards non-boolean
  # attributes as Python's str() of the value, so a list arrives as its repr():
  #     ['Home Cinema', "Rob's Mix", 'Flat']
  # That is not JSON, but ArduinoJson accepts single-quoted strings and the `\'` escape, which
  # covers everything repr() writes for a group name except `\xNN` (used only for control
  # characters). Parsing is all-or-nothing: a partial list would put the wrong name at an
  # index, whereas an empty one just means no picker.
  #
  # When the select goes unavailable the attribute disappears and this holds its last value,
  # which is harmless: sys_state then refuses the picker anyway.
  - platform: homeassistant
    id: ha_group_options
    entity_id: ${ent_group}
    attribute: options
    on_value:
      - lambda: |-
          std::vector<std::string> names;
          JsonDocument doc;
          const bool ok = !deserializeJson(doc, x) && doc.is<JsonArray>();
          if (ok) {
            for (JsonVariant v : doc.as<JsonArray>()) {
              if (!v.is<const char *>()) {
                names.clear();
                break;
              }
              names.emplace_back(v.as<const char *>());
            }
          }
          if (names.empty() && x != "[]") {
            ESP_LOGW("dial", "could not parse the group list from '%s': %s", "${ent_group}",
                     x.c_str());
          }
          if (names != id(group_names)) {
            ESP_LOGI("dial", "%u group presets from HA", (unsigned) names.size());
            id(group_names) = std::move(names);
          }
      - script.execute: on_groups_changed

binary_sensor:
  # Mute is an attribute of the media_player, not an entity of its own — espgensam has no
  # hub-level mute switch. Reading a boolean attribute is safe because Home Assistant converts
  # bool attributes to the strings "on"/"off" before sending them (ESPHome's parse_on_off()
  # accepts only on/off/toggle, not True/False).
  - platform: homeassistant
    id: ha_muted
    entity_id: ${ent_media}
    attribute: is_volume_muted
    on_state:
      - lambda: |-
          id(is_muted) = x;
          id(mute_pending_until_ms) = 0;  // confirmed by the source of truth
      - script.execute: ui_refresh

interval:
  # Availability is derived from the API link plus the media_player state string, never from the
  # attribute sensors: when a media_player goes unavailable its attributes simply disappear and
  # those sensors silently hold their last value.
  - interval: 1s
    then:
      - script.execute: derive_state

  # One-shot wiring check, ~30 s after boot.
  #
  # A substitution naming an entity that does not exist in Home Assistant produces no state and
  # no error: hass.states.get() returns None and the integration simply sends nothing, so the
  # sensor sits empty forever. Silently losing the bus-status feed would cost the dial its
  # GLM-lockout protection with no outward sign, so name anything that never reported.
  - interval: 30s
    then:
      - lambda: |-
          static bool checked = false;
          if (checked) {
            return;
          }
          checked = true;
          if (!id(volume_known)) {
            ESP_LOGW("dial", "no usable value from '%s' - check the entity id", "${ent_volume}");
          }
          if (!id(bounds_known)) {
            ESP_LOGW("dial", "volume bounds incomplete (seen mask 0x%02x: min=%d max=%d step=%d)",
                     id(bounds_seen), (id(bounds_seen) & 0x01) != 0,
                     (id(bounds_seen) & 0x02) != 0, (id(bounds_seen) & 0x04) != 0);
          }
          if (id(ha_media_state)->state.empty()) {
            ESP_LOGW("dial", "no state from '%s' - check the entity id", "${ent_media}");
          }
          if (id(ha_bus_status)->state.empty()) {
            ESP_LOGW("dial", "no state from '%s' - check the entity id", "${ent_bus_status}");
          }
          // Not a warning: groups are optional in espgensam, and its committed config has none.
          if (id(ha_group)->state.empty()) {
            ESP_LOGI("dial", "no state from '%s' - no group rows in the picker (check the id if "
                     "espgensam has groups)", "${ent_group}");
          }
          // Also not a warning, for the same reason. A label carried by no scene is a valid
          // answer and does arrive; this means no answer came at all.
          if (!std::string_view("${scene_label}").empty() && !id(scenes_known)) {
            ESP_LOGI("dial", "no scene list from Home Assistant - no scene rows (needs action "
                     "responses: a recent Home Assistant, and this device allowed to perform "
                     "actions)");
          }

  # Expire an unconfirmed optimistic mute, snapping the screen back to what Home Assistant
  # actually reports.
  - interval: 250ms
    then:
      - lambda: |-
          if (id(mute_pending_until_ms) == 0 || millis() < id(mute_pending_until_ms)) {
            return;
          }
          id(mute_pending_until_ms) = 0;
          const bool actual = id(ha_muted)->state;
          if (actual != id(is_muted)) {
            ESP_LOGW("dial", "mute not confirmed; reverting to %s", actual ? "on" : "off");
            id(is_muted) = actual;
            id(refused_until_ms) = millis() + 700;
            id(ui_refresh)->execute();
          }

  # The same safety net for an optimistic group choice. ha_group fires only when the state
  # changes, and espgensam publishes nothing for a name it rejects, so a lost write would
  # otherwise leave the wrong group on screen.
  - interval: 250ms
    then:
      - lambda: |-
          if (id(group_pending_until_ms) == 0 || millis() < id(group_pending_until_ms)) {
            return;
          }
          id(group_pending_until_ms) = 0;
          const std::string &s = id(ha_group)->state;
          const std::string actual = (s == "unavailable" || s == "unknown") ? std::string() : s;
          if (actual != id(group_active)) {
            ESP_LOGW("dial", "group not confirmed; reverting to '%s'", actual.c_str());
            id(group_active) = actual;
            id(refused_until_ms) = millis() + 700;
            id(ui_refresh)->execute();
          }

  - interval: ${scene_refresh}
    then:
      - script.execute: target_refresh_scenes

script:
  - id: target_set_volume
    parameters:
      db: float
    then:
      # Deliberately NOT routed through `number.set: id: ha_volume`.
      #
      # HomeassistantNumber is constructed with min_value=0 and max_value=0 and only receives the
      # real bounds once Home Assistant answers its attribute requests. NumberCall::perform()
      # returns *without* calling control() whenever the value falls outside those traits, so in
      # the window before the bounds land — or any time they do not, such as after an HA restart —
      # every negative dB write is discarded with only a WARN line while reads keep working.
      #
      # Calling the action directly removes that failure mode and makes all three writes below use
      # one code path. Clamping is not lost: dial_turned already clamps to [vol_min, vol_max], and
      # this clamps again defensively.
      # The finite check is defence in depth — dial_turned already refuses to call us with a
      # value it does not have. std::min/max propagate NAN rather than clamping it away, so
      # without this a single unparseable report from Home Assistant would come straight back as
      # `value: "nan"`.
      - if:
          condition:
            lambda: |-
              if (std::isfinite(db)) {
                return true;
              }
              ESP_LOGW("dial", "refusing to write a non-finite volume");
              return false;
          then:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${ent_volume}
                  value: !lambda |-
                    const float clamped = std::min(std::max(db, id(vol_min)), id(vol_max));
                    char buf[12];
                    snprintf(buf, sizeof(buf), "%.1f", clamped);
                    return std::string(buf);
            - lambda: |-
                ESP_LOGI("dial", "write: volume -> %.1f dB", db);

  # The optimistic flip lives here, not in control.yaml, because only the transport knows how the
  # change gets confirmed. Volume has the reconciler as a safety net; mute needs its own, because
  # ha_muted only fires when the attribute actually *changes* — so a write that never lands (the
  # Home Assistant action permission being the usual cause) would otherwise leave MUTE on screen
  # forever with nothing to correct it.
  - id: target_toggle_mute
    then:
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: ${ent_media}
            is_volume_muted: !lambda 'return id(is_muted) ? "false" : "true";'
      - lambda: |-
          ESP_LOGI("dial", "write: mute -> %s", id(is_muted) ? "off" : "on");
          id(is_muted) = !id(is_muted);
          id(mute_pending_until_ms) = millis() + ${reconcile_grace};

  # Parameter is deliberately not called `on`: that collides with an ESPHome/Arduino macro and
  # fails to compile inside the lambda.
  - id: target_set_power
    parameters:
      power_on: bool
    then:
      - homeassistant.action:
          action: !lambda |-
            return std::string(power_on ? "media_player.turn_on" : "media_player.turn_off");
          data:
            entity_id: ${ent_media}
      - lambda: |-
          ESP_LOGI("dial", "write: power -> %s", power_on ? "on" : "off");

  # Optimistic like mute, and for the same reason; the interval above reverts it if Home
  # Assistant does not confirm in time.
  - id: target_set_group
    parameters:
      name: string
    then:
      - homeassistant.action:
          action: select.select_option
          data:
            entity_id: ${ent_group}
            option: !lambda "return name;"
      - lambda: |-
          ESP_LOGI("dial", "write: group -> '%s'", name.c_str());
          id(group_active) = name;
          id(group_pending_until_ms) = millis() + ${reconcile_grace};

  # Asks Home Assistant for the scenes carrying ${scene_label}.
  #
  # An ESPHome device cannot enumerate Home Assistant entities: every homeassistant-platform
  # sensor names one entity at compile time. But an action call can capture a response, and Home
  # Assistant renders the call's response_template with its full template environment, which can.
  # The template needs an action to hang off that returns a response, Home Assistant has no
  # always-present side-effect-free one, so the dial calls its own scene_query action (above)
  # through Home Assistant. Home Assistant calls back into the dial, gets `{}`, renders the
  # template, and hands the result to on_success, wrapped as {"response": <result>} like every
  # action response it sends an ESPHome device. Nothing blocks meanwhile: homeassistant.action
  # returns as soon as the call is sent.
  #
  # The template returns name-sorted parallel lists, so a "1 " prefix orders the picker, plus the
  # scene with the newest activation timestamp (a scene entity's state). That is only when it was
  # last applied, not whether the room still matches it.
  #
  # One query at a time, because ESPHome keeps a call's response callback until a response
  # arrives and has no timeout: a call Home Assistant never answers — it drops them silently when
  # the device may not perform actions — would otherwise leak one per refresh. A query unanswered
  # after 10 s stops further ones until the API reconnects. A refresh asked for while one is in
  # flight is run once that one is answered, because the answer may predate whatever prompted it
  # (a scene just applied).
  - id: target_refresh_scenes
    then:
      - lambda: |-
          const bool linked = (api::global_api_server != nullptr) &&
                              api::global_api_server->is_connected();
          if (std::string_view("${scene_label}").empty() || id(scene_query_stalled) || !linked) {
            return;
          }
          if (id(scene_query_sent_ms) != 0) {
            if (millis() - id(scene_query_sent_ms) < 10000) {
              id(scene_query_again) = true;
              return;
            }
            ESP_LOGW("dial", "no reply to the scene query; not asking again until reconnected "
                     "(is this device allowed to perform Home Assistant actions?)");
            id(scene_query_stalled) = true;
            id(scene_query_sent_ms) = 0;
            return;
          }
          id(scene_query_sent_ms) = std::max<uint32_t>(millis(), 1);
          id(scene_query_again) = false;
          id(scene_query_send)->execute();

  - id: scene_query_send
    then:
      - homeassistant.action:
          # HA's name for the action above: esphome.<node name with '-' as '_'>_scene_query.
          action: !lambda |-
            std::string node = App.get_name();
            std::replace(node.begin(), node.end(), '-', '_');
            return "esphome." + node + "_scene_query";
          capture_response: true
          response_template: |-
            {% set ns = namespace(s=[]) %}
            {% for e in label_entities('${scene_label}') | select('match', 'scene[.]') %}
              {% set ns.s = ns.s + [{'n': state_attr(e, 'friendly_name') or e, 'e': e,
                                     't': states(e)}] %}
            {% endfor %}
            {% set by_name = ns.s | sort(attribute='n') %}
            {% set seen = ns.s | rejectattr('t', 'in', ['unknown', 'unavailable'])
                               | sort(attribute='t') | list %}
            {{ {'scenes': by_name | map(attribute='n') | list,
                'entity_ids': by_name | map(attribute='e') | list,
                'last': (seen | last).e if seen else ''} }}
          on_success:
            - lambda: |-
                id(scene_query_sent_ms) = 0;
                // All-or-nothing, like the group list: a partial list would put the wrong key
                // under a name.
                JsonObjectConst result = response["response"].as<JsonObjectConst>();
                JsonArrayConst names = result["scenes"].as<JsonArrayConst>();
                JsonArrayConst keys = result["entity_ids"].as<JsonArrayConst>();
                JsonVariantConst last = result["last"];
                bool ok = !names.isNull() && !keys.isNull() && names.size() == keys.size() &&
                          last.is<const char *>();
                std::vector<std::string> n, k;
                for (size_t i = 0; ok && i < names.size(); i++) {
                  const char *name = names[i].as<const char *>();
                  const char *key = keys[i].as<const char *>();
                  ok = name != nullptr && key != nullptr && *key != '\0';
                  if (ok) {
                    n.emplace_back(name);
                    k.emplace_back(key);
                  }
                }
                if (!ok) {
                  std::string got;
                  serializeJson(response, got);
                  ESP_LOGW("dial", "unexpected scene query response, keeping the previous list: %s",
                           got.c_str());
                } else {
                  if (!id(scenes_known) || n != id(scene_names) || k != id(scene_keys)) {
                    ESP_LOGI("dial", "%u scenes from HA", (unsigned) n.size());
                    id(scene_names) = std::move(n);
                    id(scene_keys) = std::move(k);
                  }
                  id(scene_last) = last.as<const char *>();
                  id(scenes_known) = true;
                  id(on_scenes_changed)->execute();
                }
                if (id(scene_query_again)) {
                  id(target_refresh_scenes)->execute();
                }
          on_error:
            - lambda: |-
                id(scene_query_sent_ms) = 0;
                // Usually the action not being registered yet just after connecting; the next
                // refresh retries. Anything persistent would repeat every scene_refresh.
                static bool logged = false;
                if (!logged) {
                  ESP_LOGI("dial", "scene query failed: %s", error.c_str());
                  logged = true;
                } else {
                  ESP_LOGD("dial", "scene query failed: %s", error.c_str());
                }
                if (id(scene_query_again)) {
                  id(target_refresh_scenes)->execute();
                }

  - id: scene_refresh_soon
    mode: restart
    then:
      - delay: 5s
      - script.execute: target_refresh_scenes

  # Fire and forget as far as the room goes: Home Assistant reports a scene as applied, not what the
  # room then looks like. scene_last is set at once so the button and hint follow the press; the
  # refresh on success confirms it from Home Assistant's own record, and a failure reverts it.
  - id: target_activate_scene
    parameters:
      scene: string
    then:
      - lambda: |-
          ESP_LOGI("dial", "write: scene -> '%s'", scene.c_str());
          id(scene_last) = scene;
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda "return scene;"
          on_success:
            - script.execute: target_refresh_scenes
          on_error:
            - lambda: |-
                ESP_LOGW("dial", "scene '%s' not applied: %s", scene.c_str(), error.c_str());
                id(refused_until_ms) = millis() + 700;
            - script.execute: target_refresh_scenes
            - script.execute: ui_refresh

  # Promote the three attributes to a usable scale once all of them have arrived and agree.
  - id: bounds_check
    mode: restart
    then:
      - lambda: |-
          const bool ok = (id(bounds_seen) == 0x07) &&
                          std::isfinite(id(vol_min)) && std::isfinite(id(vol_max)) &&
                          std::isfinite(id(vol_step)) && id(vol_step) > 0.0f &&
                          (id(vol_max) - id(vol_min)) > 0.1f;
          if (ok == id(bounds_known)) {
            return;
          }
          id(bounds_known) = ok;
          if (ok) {
            ESP_LOGI("dial", "Volume bounds from HA: %.1f..%.1f dB step %.2f",
                     id(vol_min), id(vol_max), id(vol_step));
          } else {
            ESP_LOGW("dial", "Volume bounds no longer usable");
          }
      - script.execute: ui_refresh

  # Maps transport state onto the DialState enum. Precedence is defined in include/dial_state.h;
  # this is the only implementation of it.
  - id: derive_state
    mode: restart
    then:
      - lambda: |-
          const std::string media = id(ha_media_state)->state;
          const std::string bus = id(ha_bus_status)->state;

          // global_api_server is null until the api component has set up.
          const bool linked = (api::global_api_server != nullptr) &&
                              api::global_api_server->is_connected();
          const bool media_known =
              !media.empty() && media != "unavailable" && media != "unknown";

          // Power state is tracked on its own and never inferred from sys_state below: the two
          // answer different questions, and conflating them is what made a long press send
          // turn_off to an already-off system. See include/dial_state.h.
          if (media_known) {
            id(sys_power_off) = (media == "off");
          }

          int next;
          if (!linked || !media_known) {
            next = STATE_DISCONNECTED;
          } else if (bus == "GLM Active") {
            next = STATE_GLM_LOCKED;
          } else if (media == "off") {
            // Above every remaining bus phase, matching espgensam's status LED. Discovery wakes
            // monitors silently while the system stays off, and a system whose monitors are
            // unpowered sits at "Offline" forever because espgensam does not retry discovery
            // while in standby.
            next = STATE_STANDBY;
          } else if (bus == "Discovering" || bus == "Configuring") {
            next = STATE_WAKING;
          } else if (bus == "Offline") {
            next = STATE_OFFLINE;
          } else {
            next = STATE_ACTIVE;
          }

          if (next != id(sys_state)) {
            ESP_LOGI("dial", "state %d -> %d (media='%s' bus='%s')",
                     id(sys_state), next, media.c_str(), bus.c_str());
            id(sys_state) = next;
            id(ui_refresh)->execute();
          }
