# CONTROL: input handling, optimistic local state, writes, reconciliation.
#
# This package must never name a Home Assistant entity or call an HA action directly. It talks to
# the controlled system only through the target_* scripts provided by the transport package, and
# reads system condition only from the globals that package writes. That is what makes the
# transport swappable.

globals:
  # --- Written by the transport package -----------------------------------------------------
  - id: vol_db
    type: float
    restore_value: false
    initial_value: "-50.0"
  # Fallbacks, used only for clamping until the real bounds arrive from Home Assistant. They
  # match espgensam's committed config; the -25.0 variant lives in its
  # espgensam-atoms3-rs485-iso-local.yaml. Never treat these as the truth — bounds_known says
  # whether the real ones have landed, and the UI suppresses the scale until they have.
  - id: vol_min
    type: float
    restore_value: false
    initial_value: "-80.0"
  - id: vol_max
    type: float
    restore_value: false
    initial_value: "-30.0"
  - id: vol_step
    type: float
    restore_value: false
    initial_value: "0.5"
  - id: bounds_known # real min/max/step received from Home Assistant and usable
    type: bool
    restore_value: false
    initial_value: "false"
  - id: bounds_seen # bitmask of arrived attributes: 0x01 min, 0x02 max, 0x04 step
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # Whether vol_db reflects a value Home Assistant actually reported. False at boot and whenever
  # the entity goes unavailable — Home Assistant then sends a state ESPHome cannot parse, and the
  # homeassistant number platform publishes NAN for it. Without this the dial would believe its
  # own -50.0 placeholder, and relative knob movement would jump from a value nobody chose.
  - id: volume_known
    type: bool
    restore_value: false
    initial_value: "false"
  - id: is_muted
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sys_power_off # media_player reports "off"; the ONLY basis for power intent
    type: bool
    restore_value: false
    initial_value: "true"
  - id: sys_state
    type: int
    restore_value: false
    initial_value: "0" # STATE_DISCONNECTED — nothing is known until the API connects
  - id: mute_pending_until_ms # optimistic mute awaiting confirmation; 0 = nothing pending
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Group preset names in espgensam's own order. Empty means espgensam has no groups, or the list
  # has not arrived yet; either way there is no picker.
  - id: group_names
    type: std::vector<std::string>
    restore_value: false
  - id: group_active # current group name; "" when unknown or unavailable
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: group_pending_until_ms # optimistic group choice awaiting confirmation; 0 = none
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # --- Owned by control / UI ----------------------------------------------------------------
  - id: vol_sent # last value handed to the transport
    type: float
    restore_value: false
    initial_value: "-50.0"
  - id: vol_reported # last value the transport reported, even when ignored
    type: float
    restore_value: false
    initial_value: "-50.0"
  # A report arrived inside the grace period and was ignored, so it still has to be judged once
  # that period ends. That is the only place a refused write shows up.
  - id: reconcile_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: last_detent_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_local_change_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_write_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: at_limit
    type: bool
    restore_value: false
    initial_value: "false"
  - id: at_limit_edge # true only on the detent that first reaches a limit
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ui_arc_pos # 0..1000, normalized volume position
    type: int
    restore_value: false
    initial_value: "0"
  # The readout strings, formatted once per repaint. ui_refresh assigns them to the primary and
  # secondary labels according to primary_readout.
  - id: ui_db_text
    type: std::string
    restore_value: false
  - id: ui_pct_text
    type: std::string
    restore_value: false
  - id: ui_secondary_shown # the secondary readout is visible; see secondary_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: refused_until_ms # amber "write refused" pulse expiry
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: ui_mode # a UiMode value (see include/dial_state.h)
    type: int
    restore_value: false
    initial_value: "0" # UI_VOLUME
  - id: picker_index # highlighted row of the group picker; meaningful only while it is open
    type: int
    restore_value: false
    initial_value: "0"
  # Tracks the last backlight script run, so a tap on a dimmed screen can just wake it.
  - id: backlight_dimmed
    type: bool
    restore_value: false
    initial_value: "false"

switch:
  # Audible detent clicks, off by default. An 80 dB buzzer ticking on every detent is intolerable
  # in a studio, and this is a device whose entire job is not making unwanted noise — so the
  # buzzer is reserved for information (range limits, refused writes) unless you ask otherwise.
  - platform: template
    name: "Click feedback"
    id: click_feedback
    icon: mdi:volume-vibrate
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

sensor:
  # Exposed so the dial's own view of volume is visible in Home Assistant for debugging. Not used
  # by the UI, which reads the global directly.
  - platform: template
    name: "Dial Volume"
    id: dial_volume_debug
    unit_of_measurement: dB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 10s
    lambda: "return id(vol_db);"

  # Encoder triggers are bound here rather than in the board package, so that swapping the board
  # cannot accidentally change what a detent means.
  - id: !extend dial_encoder
    on_clockwise:
      - script.execute:
          id: knob_turned
          dir: 1
    on_anticlockwise:
      - script.execute:
          id: knob_turned
          dir: -1

script:
  # Routes a detent by UI mode. Kept separate from dial_turned so the volume path, and the spin
  # acceptance test that guards it, are untouched by the picker. Same mode as dial_turned, for the
  # same reason.
  - id: knob_turned
    mode: parallel
    max_runs: 8
    parameters:
      dir: int
    then:
      - lambda: |-
          if (id(ui_mode) == UI_GROUP_PICKER) {
            id(picker_turned)->execute(dir);
          } else {
            id(dial_turned)->execute(dir);
          }

  # ---------------------------------------------------------------------------------------------
  # One detent of the encoder.
  #
  # mode: parallel is belt-and-braces. This body contains no delay, so script.execute runs it
  # synchronously to completion and detents cannot actually overlap today. But if a delay is ever
  # added here, `single` would start silently dropping detents with a "script already running"
  # warning — and dropping a detent is the one failure this device must not have.
  # ---------------------------------------------------------------------------------------------
  - id: dial_turned
    mode: parallel
    max_runs: 8
    parameters:
      dir: int
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t gap = now - id(last_detent_ms);
          id(last_detent_ms) = now;

          // espgensam silently drops writes in both of these conditions. Refuse the input rather
          // than moving the arc and letting it snap back, which would read as a bug in the dial.
          // volume_known matters as much as the bus states: a detent is a *relative* change, so
          // without a known starting point it would jump the system to an arbitrary level.
          if (id(sys_state) == STATE_DISCONNECTED || id(sys_state) == STATE_GLM_LOCKED ||
              !id(volume_known)) {
            id(refused_until_ms) = now + 700;
            // `return` ends this lambda, not the script: the actions below still run. Clear the
            // edge flag or feedback_tick would beep using the previous accepted detent's value.
            id(at_limit_edge) = false;
            return;
          }

          // Acceleration: the faster you turn, the coarser the step.
          float step = ${step_slow};
          if (gap < ${gap_flick}) {
            step = ${step_flick};
          } else if (gap < ${gap_brisk}) {
            step = ${step_brisk};
          } else if (gap < ${gap_steady}) {
            step = ${step_steady};
          }

          float v = id(vol_db) + dir * step;
          // Snap to the device's own grid so we never ask for an unrepresentable value.
          if (id(vol_step) > 0.0f) {
            v = roundf(v / id(vol_step)) * id(vol_step);
          }
          const bool was_at_limit = id(at_limit);
          id(vol_db) = std::min(std::max(v, id(vol_min)), id(vol_max));
          id(at_limit) = (id(vol_db) <= id(vol_min) + 0.001f ||
                          id(vol_db) >= id(vol_max) - 0.001f);
          // Only the detent that *arrives* at a limit is notable. Holding the knob against the
          // stop must not buzz on every detent.
          id(at_limit_edge) = (!was_at_limit && id(at_limit));
          id(last_local_change_ms) = now;
      - script.execute: wake_backlight
      # Local and immediate — this, not the network round trip, is the perceived responsiveness.
      - script.execute: ui_refresh
      - script.execute: feedback_tick
      # Hand the new value to the transport. One write per detent is fine: espgensam paces and
      # coalesces volume writes itself, sending each in a safe bus slot at most every 50 ms
      # (its `volume_tx_interval`), so the dial does not need to rate-limit.
      #
      # This runs even after a refused detent (the `return` above only ends that lambda); the
      # dirty check makes it a no-op then, and at a range limit.
      #
      # last_write_ms MUST be set before calling the transport: target_set_volume re-enters
      # on_volume_reported synchronously, and the reconciler relies on that timestamp to
      # recognise the echo as its own.
      - lambda: |-
          // Never send a value that was not derived from a real report, nor a non-finite one: a
          // NAN difference compares false against every threshold and would read as dirty forever.
          if (!id(volume_known) || !std::isfinite(id(vol_db)) || !std::isfinite(id(vol_sent))) {
            return;
          }
          if (fabsf(id(vol_db) - id(vol_sent)) < 0.01f) {
            return;  // not dirty
          }
          id(vol_sent) = id(vol_db);
          id(last_write_ms) = millis();
          id(target_set_volume)->execute(id(vol_db));

  # ---------------------------------------------------------------------------------------------
  # Reconciliation of reported volume against local state.
  #
  # Three cases have to be told apart: the echo of our own write, a stale value arriving while the
  # user is still turning, and a genuine external change (HA slider, Genelec's GLM software, an
  # HDMI CEC bridge).
  #
  # A refused write is NOT recognisable here. espgensam publishes the old value back as soon as it
  # refuses, so that report lands inside the grace period alongside the echoes. The last report
  # from inside the grace period is therefore judged when the period ends (see the 250 ms
  # interval), and a divergent report arriving outside it is always someone else's change. Judging
  # it here against vol_sent once flagged every external change as refused, since vol_sent equals
  # vol_db at rest.
  # ---------------------------------------------------------------------------------------------
  - id: on_volume_reported
    parameters:
      reported: float
    then:
      - lambda: |-
          const uint32_t now = millis();

          // An unavailable/unknown entity arrives here as NAN (HomeassistantNumber publishes NAN
          // when it cannot parse the state). Every comparison below would then be false, so the
          // guards fail *open*: NAN would be adopted into vol_db and vol_sent, the write path
          // would see a permanently dirty value, and the dial would write value: "nan" to Home
          // Assistant on every detent. Reject it up front and mark the volume unknown instead.
          if (!std::isfinite(reported)) {
            if (id(volume_known)) {
              ESP_LOGW("dial", "volume entity reported no usable value; volume now unknown");
            }
            id(volume_known) = false;
            return;
          }

          id(vol_reported) = reported;
          const bool first_report = !id(volume_known);
          id(volume_known) = true;

          // The first usable report is authoritative: adopt it outright rather than reconciling
          // against the placeholder vol_db started from.
          if (first_report) {
            ESP_LOGI("dial", "volume known: %.1f dB", reported);
            id(vol_db) = reported;
            id(vol_sent) = reported;
            return;
          }

          const bool user_active = (now - id(last_local_change_ms)) < ${reconcile_grace};
          const bool write_inflight = (now - id(last_write_ms)) < ${reconcile_grace};
          if (user_active || write_inflight) {
            // Our own echo, stale, or a refusal. Recorded above and judged when the grace period
            // ends.
            id(reconcile_pending) = true;
            return;
          }
          id(reconcile_pending) = false;  // this report supersedes any still awaiting judgement

          const float tol = (id(vol_step) > 0.0f) ? id(vol_step) / 2.0f : 0.25f;
          if (fabsf(reported - id(vol_db)) < tol) {
            return;  // already agreed
          }

          ESP_LOGI("dial", "adopting external volume change %.1f dB (was %.1f)", reported,
                   id(vol_db));
          id(vol_db) = reported;
          id(vol_sent) = reported;
      - script.execute: ui_refresh

  # Short press: mute. Optimistic local flip so the screen reacts at once; the transport's
  # binary_sensor corrects it if Home Assistant disagrees.
  - id: dial_pressed
    then:
      - script.execute: wake_backlight
      - if:
          condition:
            lambda: |-
              return id(sys_state) != STATE_DISCONNECTED && id(sys_state) != STATE_GLM_LOCKED;
          then:
            # target_toggle_mute performs the optimistic flip itself and arms the confirmation
            # timeout, because only the transport knows how the change gets confirmed.
            - script.execute: target_toggle_mute
            - script.execute: ui_refresh
          else:
            - lambda: |-
                id(refused_until_ms) = millis() + 700;
            - script.execute: ui_refresh

  # Long press: power. Deliberate gesture for the rarer, more consequential action.
  - id: dial_held
    then:
      - script.execute: wake_backlight
      - if:
          condition:
            lambda: |-
              return id(sys_state) != STATE_DISCONNECTED && id(sys_state) != STATE_GLM_LOCKED;
          then:
            - script.execute:
                id: target_set_power
                # From the media_player state alone. Deriving this from sys_state used to mean a
                # system that was both off AND had no monitors online resolved to OFFLINE, so a
                # long press sent turn_off to an already-off system and could never switch it on.
                power_on: !lambda "return id(sys_power_off);"
          else:
            - lambda: |-
                id(refused_until_ms) = millis() + 700;
            - script.execute: ui_refresh

  # Buzzer. Silent on ordinary detents unless the user opted in; always audible at a range limit.
  - id: feedback_tick
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(at_limit_edge);"
          then:
            - rtttl.play: "limit:d=32,o=6,b=200:c"
          else:
            - if:
                condition:
                  switch.is_on: click_feedback
                then:
                  - rtttl.play: "tick:d=64,o=7,b=220:c"

  # ---------------------------------------------------------------------------------------------
  # Group picker.
  #
  # Opened by a tap on the group button, driven by the knob, confirmed by a short press. Nothing is sent until that
  # press, because applying a group is not cheap: espgensam pushes routing, crossover, level,
  # delay and EQ to every monitor and ducks the volume while it does. Browsing past a group must
  # never apply it.
  #
  # Accepted in the same states as mute and power. espgensam also accepts a choice made in standby,
  # while waking or with no monitors online: it holds the request and pushes it at the next
  # discovery, where it takes precedence over re-applying the previous group.
  # ---------------------------------------------------------------------------------------------
  - id: picker_open
    then:
      - if:
          condition:
            # A tap on a dimmed screen only wakes it, wherever it lands.
            lambda: "return id(backlight_dimmed);"
          then:
            - script.execute: wake_backlight
          else:
            - script.execute: wake_backlight
            - if:
                condition:
                  lambda: |-
                    return !id(group_names).empty() && id(sys_state) != STATE_DISCONNECTED &&
                           id(sys_state) != STATE_GLM_LOCKED;
                then:
                  - lambda: |-
                      // Start on the group in use, so an accidental press re-selects it — which
                      // picker_confirm treats as a no-op.
                      id(picker_index) = 0;
                      const auto &names = id(group_names);
                      for (size_t i = 0; i < names.size(); i++) {
                        if (names[i] == id(group_active)) {
                          id(picker_index) = (int) i;
                          break;
                        }
                      }
                      id(ui_mode) = UI_GROUP_PICKER;
                  - script.execute: picker_show
                  - script.execute: picker_timeout
                else:
                  - lambda: |-
                      id(refused_until_ms) = millis() + 700;
                  - script.execute: ui_refresh

  # No wrap-around: the ends are where the list visibly starts and stops, and the beep on arrival
  # matches the volume limits.
  - id: picker_turned
    parameters:
      dir: int
    then:
      - lambda: |-
          const int last = std::max((int) id(group_names).size() - 1, 0);
          const int next = std::min(std::max(id(picker_index) + dir, 0), last);
          id(at_limit_edge) = (next != id(picker_index)) && (next == 0 || next == last);
          id(picker_index) = next;
      - script.execute: wake_backlight
      - script.execute: picker_repaint
      - script.execute: feedback_tick
      - script.execute: picker_timeout

  - id: picker_confirm
    then:
      - script.execute: wake_backlight
      - if:
          condition:
            lambda: |-
              return id(picker_index) >= 0 &&
                     id(picker_index) < (int) id(group_names).size() &&
                     id(sys_state) != STATE_DISCONNECTED && id(sys_state) != STATE_GLM_LOCKED;
          then:
            - lambda: |-
                // Confirming the group already in use closes the picker without a write. A
                // re-push would duck the volume for nothing.
                const std::string name = id(group_names)[id(picker_index)];
                if (name != id(group_active)) {
                  id(target_set_group)->execute(name);
                }
          else:
            - lambda: |-
                id(refused_until_ms) = millis() + 700;
      - script.execute: picker_close

  - id: picker_close
    then:
      - lambda: |-
          id(ui_mode) = UI_VOLUME;
      - script.execute: picker_hide
      - script.execute: ui_refresh

  # Restarted by every picker input. Never stopped: picker_open restarts it, and a timeout that
  # fires after the picker has already closed finds nothing to do.
  - id: picker_timeout
    mode: restart
    then:
      - delay: ${picker_timeout}
      - if:
          condition:
            lambda: "return id(ui_mode) == UI_GROUP_PICKER;"
          then:
            - script.execute: picker_close

  # Invoked by the transport whenever it (re)delivers group_names.
  - id: on_groups_changed
    then:
      - if:
          condition:
            lambda: "return id(ui_mode) == UI_GROUP_PICKER;"
          then:
            - if:
                condition:
                  lambda: "return id(group_names).empty();"
                then:
                  - script.execute: picker_close
                else:
                  - lambda: |-
                      id(picker_index) =
                          std::min(id(picker_index), (int) id(group_names).size() - 1);
                  - script.execute: picker_populate
      - script.execute: ui_refresh

  # lvgl's on_idle fires once per idle period, and only LVGL input (touch) ends that period. The
  # knob and button bypass LVGL, so without the activity reset below, waking the screen from them
  # left LVGL still idle, the dim never fired again, and the backlight stayed bright for good.
  - id: wake_backlight
    mode: restart
    then:
      - lambda: |-
          id(backlight_dimmed) = false;
          lv_display_trigger_activity(nullptr);  // the default (only) display
      - light.turn_on:
          id: display_backlight
          brightness: ${active_brightness}

  - id: dim_backlight
    mode: restart
    then:
      - lambda: |-
          id(backlight_dimmed) = true;
      - light.turn_on:
          id: display_backlight
          brightness: ${idle_brightness}

interval:
  # Judge the last report from inside the grace period once that period ends, expire the amber
  # "refused" pulse, and hide the secondary readout once secondary_hold has passed since the last
  # detent.
  - interval: 250ms
    then:
      - lambda: |-
          // A report ignored during the grace period that still disagrees once the period is over
          // means espgensam did not apply our write. Snap back to it, visibly.
          if (id(reconcile_pending) && id(volume_known) &&
              (millis() - id(last_local_change_ms)) >= ${reconcile_grace} &&
              (millis() - id(last_write_ms)) >= ${reconcile_grace}) {
            id(reconcile_pending) = false;
            const float tol = (id(vol_step) > 0.0f) ? id(vol_step) / 2.0f : 0.25f;
            if (fabsf(id(vol_reported) - id(vol_db)) >= tol) {
              ESP_LOGW("dial", "write not applied; reverting to %.1f dB", id(vol_reported));
              id(vol_db) = id(vol_reported);
              id(vol_sent) = id(vol_reported);
              id(refused_until_ms) = millis() + 700;
              id(ui_refresh)->execute();
            }
          }

          static bool was_refusing = false;
          const bool refusing = millis() < id(refused_until_ms);
          const bool secondary_expired = id(ui_secondary_shown) &&
              (millis() - id(last_local_change_ms)) >= ${secondary_hold};
          if ((was_refusing && !refusing) || secondary_expired) {
            id(ui_refresh)->execute();
          }
          was_refusing = refusing;
      # Close the picker when the system stops accepting a choice while it is open. Polled here
      # rather than hooked into derive_state, which belongs to the transport.
      - if:
          condition:
            lambda: |-
              return id(ui_mode) == UI_GROUP_PICKER &&
                     (id(sys_state) == STATE_DISCONNECTED || id(sys_state) == STATE_GLM_LOCKED);
          then:
            - script.execute: picker_close

binary_sensor:
  # In the group picker a long press cancels rather than powering the system: a user who has
  # opened a menu is not reaching for the power switch, and must not get it by holding too long.
  - id: !extend front_button
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at least 30ms
        then:
          - lambda: |-
              if (id(ui_mode) == UI_GROUP_PICKER) {
                id(picker_confirm)->execute();
              } else {
                id(dial_pressed)->execute();
              }
      - timing:
          - ON for at least 800ms
        then:
          - lambda: |-
              if (id(ui_mode) == UI_GROUP_PICKER) {
                id(picker_close)->execute();
              } else {
                id(dial_held)->execute();
              }
