# UI: the volume screen.
#
# Like control.yaml, this package must never name a Home Assistant entity. It renders the globals
# and nothing else.
#
# Layout notes for the 240x240 round panel: the bezel eats the corners, so everything meaningful
# lives inside a ~200 px safe circle and every element is centre-aligned with a vertical offset.
# The vertical offsets were chosen so the readout stays legible across a room; they are the most
# likely thing to want nudging on the bench.
#
# One value is the readout and the other only a hint while turning: primary_readout picks which of
# dB and percentage is the large number, and the other shows small underneath for secondary_hold
# after each detent. Both at all times was too busy. A near-black monitor silhouette sits behind the
# readout as decoration; see its comment in page_volume.
#
# The ring colour answers one question: is the level shown the level you hear? The status badge
# says why when it is not. See ui_refresh for the precedence.
#   - green: live. The same test as the white primary number: STATE_ACTIVE and not muted.
#   - dim grey: held. Standby, waking or no monitors. The level is kept but not heard. Green is
#     kept for live only, so the monitors being off never reads as "on".
#   - red: muted, in any state that accepts input. This is the Genelec monitors' own mute colour:
#     their status LED goes solid red when muted.
#   - empty: no control (no link, or GLM owns the bus). The indicator takes the track colour.
#   - amber: input refused. Only as a short pulse in reaction to a knob turn, never steady.
#
# Mute needs its own colour, separate from held, because the badge shows a state word in
# preference to MUTE. In standby, waking or offline the ring is then the only sign of mute.
#
# The bus phases deliberately have no colours of their own. This palette once copied espgensam's
# status LED. Bus status is an internal detail, and most controller boards have no RGB LED to
# match, so the badge words carry the phase instead. Do not restore per-phase colours.

font:
  # Glyph subsetting keeps compile time and RAM down. Flash is 8 MB so the fonts themselves are
  # cheap, but every glyph is rasterised into the binary.
  - file: "gfonts://Rubik@600"
    id: font_value
    size: 52
    bpp: 4
    glyphs: "-.0123456789"
  - file: "gfonts://Rubik@500"
    id: font_pct
    size: 22
    bpp: 4
    # Also carries the dB value when it is secondary ("-42.5 dB").
    glyphs: "-.0123456789% dB"
  - file: "gfonts://Rubik"
    id: font_small
    size: 16
    bpp: 4
    # Carries the "dB" unit, every status badge word, "MUTE" and the group name. Group names come
    # from the user's GLM setup at runtime, so this is a whole Latin glyph set rather than a
    # subset of known words.
    glyphsets: [GF_Latin_Core]

# The background silhouette. An alpha mask, which LVGL stores as A8 and paints in the widget's
# image_recolor colour, so its colour is set on the widget below.
image:
  - platform: file
    file: images/monitor_silhouette.png
    id: monitor_silhouette
    type: GRAYSCALE
    transparency: alpha_channel

lvgl:
  displays: [round_display]
  touchscreens: [touch]
  # No rotation. The mipi_spi GC9A01A model already applies mirror_x, which lands this panel the
  # right way up on its own.
  #
  # Do not reinstate `rotation: 180`. It comes from widely-copied M5Dial configs built on the
  # deprecated `ili9xxx` driver, whose GC9A01A has a different init sequence and so a different
  # base orientation; carrying that value over to mipi_spi renders the whole screen upside down.
  # A quick check that this is right: the volume arc's gap (start_angle 135 / end_angle 45) must
  # sit at the BOTTOM, under the hand. If it is at the top, the rotation is wrong.
  #
  # Rotation belongs here rather than on the display so that LVGL rotates touch coordinates with
  # it — that remains true if a future panel does need rotating.
  rotation: 0
  # 240*240*2 = 115 KB for a full frame, against 512 KB SRAM and NO PSRAM. 25% is the documented
  # recommendation for PSRAM-less boards; ESPHome falls back to 12% if allocation fails.
  buffer_size: 25%
  bg_color: 0x000000
  default_font: font_small
  on_idle:
    timeout: ${idle_timeout}
    then:
      - script.execute: dim_backlight

  pages:
    - id: page_volume
      bg_color: 0x000000
      pad_all: 0
      widgets:
        # Background art: a studio monitor silhouette in the Genelec cabinet shape, with tweeter,
        # woofer and LED dot cut out. Pure decoration that never shows state; the ring and badge do
        # that. It comes first so it is drawn behind everything else.
        #
        # The image is an alpha mask, so the colour is set here. 0x101010 is deliberately only just
        # above black, so the silhouette all but disappears when the backlight dims.
        #
        # The cabinet spans y -76..+64, inside the ring's ~97 px inner radius and clear of the
        # group button below. The woofer sits behind the large number, the tweeter behind the badge.
        - image:
            id: spk_silhouette
            src: monitor_silhouette
            align: CENTER
            y: -6
            image_recolor: 0x101010
            image_recolor_opa: COVER
            clickable: false

        # The volume ring. 270 degrees of sweep with the gap at the bottom, which is where the
        # hand covers the screen anyway.
        - arc:
            id: vol_arc
            align: CENTER
            width: 226
            height: 226
            min_value: 0
            # Normalized rather than in dB: the real range is discovered from Home Assistant at
            # runtime, and an arc value is an int16 so half-dB steps would not survive it.
            max_value: 1000
            value: 0
            start_angle: 135
            end_angle: 45
            arc_width: 16
            arc_rounded: true
            # Touch must never drag the volume — a stray palm should not change monitor level.
            adjustable: false
            # The default 720 deg/s animation limit visibly trails a fast spin, which is exactly
            # the lag this whole design exists to avoid.
            change_rate: 3600
            arc_color: 0x1A1A1A
            indicator:
              arc_color: 0x22C55E
              arc_width: 16
              arc_rounded: true

        # Status badge: the system state, or MUTE when the system is otherwise plainly active.
        # Empty (invisible) when it is active and unmuted. See ui_refresh for the precedence.
        - label:
            id: status_label
            align: CENTER
            y: -60
            text: ""
            text_font: font_small
            text_color: 0xF59E0B

        # Primary readout: dB or percentage, per primary_readout. Its unit goes underneath.
        - label:
            id: primary_label
            align: CENTER
            y: -18
            text: "--.-"
            text_font: font_value
            text_color: 0xFFFFFF

        - label:
            id: unit_label
            align: CENTER
            y: 20
            text: "dB"
            text_font: font_small
            text_color: 0x8A8A8A

        # Secondary readout: the other value, shown only while the knob is turning. The percentage
        # matches the 0..1 scale Home Assistant's media_player shows. See ui_refresh for why it is
        # computed locally rather than read back.
        - label:
            id: secondary_label
            align: CENTER
            y: 46
            hidden: true
            text: ""
            text_font: font_pct
            text_color: 0xA8A8A8

        # Full-screen invisible tap target. Tapping only wakes the backlight — it deliberately
        # does not change volume, mute or power, so picking the device up is never destructive.
        - button:
            id: touch_overlay
            align: CENTER
            width: 240
            height: 240
            bg_opa: 0%
            border_width: 0
            shadow_width: 0
            on_short_click:
              - script.execute: wake_backlight

        # The active group preset, drawn as a button in the ring's bottom gap. Only this opens
        # the picker: a tap on the readout above is far more likely to be a hand picking the
        # dial up than a request for a menu. It must come after touch_overlay, so that it sits
        # on top and receives its own touches. It is hidden when espgensam has no groups, and
        # its touches then fall through to the overlay.
        #
        # Two lines of font_small tall, so a longer GLM group name wraps instead of being cut
        # short. The panel's circle narrows to ~120 px across at this height, which caps the
        # width, and the bottom edge is as low as the corners can go and stay on the glass, so
        # any extra height has to come from above. That is why MUTE lives in the status badge. ext_click_area makes the target bigger than
        # the pill without drawing it bigger. The position and size want checking on the bench.
        - button:
            id: group_button
            align: CENTER
            y: 89
            width: 112
            height: 42
            radius: 12
            hidden: true
            ext_click_area: 8
            bg_color: 0x1A1A1A
            bg_opa: COVER
            border_width: 1
            border_color: 0x3A3A3A
            shadow_width: 0
            pad_all: 0
            pressed:
              bg_color: 0x2A2A2A
              border_color: 0x6A6A6A
            on_short_click:
              - script.execute: picker_open
            widgets:
              # Sized to its text up to two lines, so a one-line name sits centred; beyond two,
              # LVGL ends the second line with dots. 38 = 2 x font_small's 19 px line height.
              - label:
                  id: group_label
                  align: CENTER
                  width: 100
                  max_height: 38
                  long_mode: DOT
                  text_align: CENTER
                  text: ""
                  text_font: font_small
                  text_color: 0xA8A8A8

script:
  # ---------------------------------------------------------------------------------------------
  # Repaint everything from the globals. Called on every detent (hence kept cheap) and on every
  # state change.
  #
  # The percentage is computed here rather than read back from Home Assistant's volume_level
  # attribute. espgensam maps the media_player's 0..1 slider linearly in dB across the same bounds
  # the number entity reports (volume_db_to_slider() in components/gensam/util.h), so the
  # percentage is arithmetically identical to the normalized arc position. Computing it locally
  # keeps it in the same instant as the arc and the dB number; reading it back would make it visibly
  # lag the value it sits beside, which looks broken.
  #
  # Note 0% here means vol_min (-80 dB), not silence: espgensam treats only slider <= 0.001 as true
  # silence (-130 dB), and that case is unreachable coming from dB.
  #
  # The scale is suppressed until bounds_known. The dB number stays visible throughout because it
  # is truthful on its own — it comes from the entity's state — but the arc and percentage are
  # meaningless without the real range, and drawing them against the fallback would state a
  # precise-looking figure that is simply wrong (at -80..-25 bounds, -50 dB reads 60% on a
  # -80..-30 guess instead of 55%).
  # ---------------------------------------------------------------------------------------------
  - id: ui_refresh
    mode: restart
    then:
      - lambda: |-
          const float span = id(vol_max) - id(vol_min);
          if (id(volume_known) && id(bounds_known) && span > 0.1f) {
            float frac = (id(vol_db) - id(vol_min)) / span;
            frac = std::min(std::max(frac, 0.0f), 1.0f);
            id(ui_arc_pos) = (int) lroundf(frac * 1000.0f);
          } else {
            id(ui_arc_pos) = 0;
          }

          // Until Home Assistant reports a usable value there is no honest number to show.
          // The placeholder vol_db started from is not one.
          char buf[12];
          if (!id(volume_known) || !std::isfinite(id(vol_db))) {
            id(ui_db_text) = "--.-";
          } else {
            snprintf(buf, sizeof(buf), "%.1f", id(vol_db));
            id(ui_db_text) = buf;
          }
          if (!id(volume_known) || !id(bounds_known)) {
            id(ui_pct_text) = "--";
          } else {
            snprintf(buf, sizeof(buf), "%d", (int) lroundf(id(ui_arc_pos) / 10.0f));
            id(ui_pct_text) = buf;
          }

          // Only an accepted detent sets last_local_change_ms, so a refused turn or a change made
          // elsewhere (a Home Assistant slider, GLM) never shows the secondary. 0 means none yet.
          id(ui_secondary_shown) = id(last_local_change_ms) != 0 &&
              (millis() - id(last_local_change_ms)) < ${secondary_hold};

      - lvgl.arc.update:
          id: vol_arc
          value: !lambda "return id(ui_arc_pos);"

      - lvgl.label.update:
          id: primary_label
          text: !lambda |-
            constexpr std::string_view kPrimary = "${primary_readout}";
            static_assert(kPrimary == "db" || kPrimary == "percent",
                          "primary_readout must be \"db\" or \"percent\"");
            return kPrimary == "percent" ? id(ui_pct_text) : id(ui_db_text);

      - lvgl.label.update:
          id: unit_label
          text: !lambda |-
            constexpr std::string_view kPrimary = "${primary_readout}";
            return std::string(kPrimary == "percent" ? "%" : "dB");

      - lvgl.label.update:
          id: secondary_label
          text: !lambda |-
            constexpr std::string_view kPrimary = "${primary_readout}";
            return kPrimary == "percent" ? id(ui_db_text) + " dB" : id(ui_pct_text) + "%";

      - lvgl.widget.update:
          id: secondary_label
          hidden: !lambda "return !id(ui_secondary_shown);"

      # Ring colour. See the file comment for what each colour means. No control comes before mute,
      # because a mute state is meaningless or stale when nothing can be controlled.
      - lvgl.arc.update:
          id: vol_arc
          indicator:
            arc_color: !lambda |-
              if (millis() < id(refused_until_ms)) return lv_color_hex(0xF59E0B);  // amber
              const int s = id(sys_state);
              if (s == STATE_DISCONNECTED || s == STATE_GLM_LOCKED) {
                return lv_color_hex(0x1A1A1A);  // the track colour, so the ring reads as empty
              }
              if (id(is_muted)) return lv_color_hex(0xDC2626);         // red
              if (s != STATE_ACTIVE) return lv_color_hex(0x4A4A4A);    // dim grey, held
              return lv_color_hex(0x22C55E);                           // green, live

      # The primary number dims whenever the value is not currently audible.
      - lvgl.label.update:
          id: primary_label
          text_color: !lambda |-
            const bool live = (id(sys_state) == STATE_ACTIVE) && !id(is_muted);
            return live ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x777777);

      # One badge for state and mute. A state word wins over MUTE. When muted, the ring turns red in
      # every state that accepts input, so the word is then the only thing saying what the state
      # is, whereas the red ring and dimmed primary number still say "muted" on their own.
      - lvgl.label.update:
          id: status_label
          text: !lambda |-
            if (millis() < id(refused_until_ms)) return std::string("refused");
            switch (id(sys_state)) {
              case STATE_DISCONNECTED: return std::string("no link");
              case STATE_GLM_LOCKED:   return std::string("GLM");
              case STATE_WAKING:       return std::string("waking");
              case STATE_OFFLINE:      return std::string("no monitors");
              case STATE_STANDBY:      return std::string("standby");
              default:                 break;
            }
            return id(is_muted) ? std::string("MUTE") : std::string("");
          text_color: !lambda |-
            const bool mute_shown = millis() >= id(refused_until_ms) &&
                                    id(sys_state) == STATE_ACTIVE && id(is_muted);
            return mute_shown ? lv_color_hex(0xDC2626) : lv_color_hex(0xF59E0B);

      - lvgl.widget.update:
          id: group_button
          hidden: !lambda "return id(group_names).empty();"

      # With groups but no active one yet (espgensam in listen-only mode, or started with
      # `default_group: none`), the button still has to read as something to press.
      - lvgl.label.update:
          id: group_label
          text: !lambda |-
            return id(group_active).empty() ? std::string("Group") : id(group_active);

      # The picker shows which row is the active group, and that can change underneath it.
      - if:
          condition:
            lambda: "return id(ui_mode) == UI_GROUP_PICKER;"
          then:
            - script.execute: picker_repaint
